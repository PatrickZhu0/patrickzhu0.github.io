---
layout: default
title: 博客
article_list: true
---
  <main>
    <section class="hero">
      <div class="shell hero-inner">
        <p class="eyebrow">PATRICK / DEVLOG</p>
        <h1>游戏开发手记</h1>
        <p class="hero-summary">记录游戏开发中的技术实践、调试过程与项目复盘。</p>
        <a class="button" href="#articles">浏览文章 <span aria-hidden="true">↓</span></a>
      </div>
    </section>

    <section class="shell articles" id="articles" aria-labelledby="articles-title">
      <div class="article-list-heading">
        <h2 id="articles-title">最新文章</h2>
        <a href="{{ '/archive.html' | relative_url }}">查看全部文章 <span aria-hidden="true">↗</span></a>
      </div>
      {% for post in site.posts %}
        {% include article-card.html post=post %}
      {% endfor %}
    </section>
  </main>
