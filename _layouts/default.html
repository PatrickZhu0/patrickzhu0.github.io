<!doctype html>
<html lang="{{ site.lang | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v=markdown">
</head>
<body>
  <header class="site-header">
    <div class="shell">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">P</span> {{ site.title | escape }}</a>
      <nav class="site-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}#articles">文章</a>
      </nav>
    </div>
  </header>

  {{ content }}

  <footer class="site-footer">
    <div class="shell"><span>{{ site.title | escape }}</span><a href="https://github.com/PatrickZhu0">GitHub <span aria-hidden="true">↗</span></a></div>
  </footer>
</body>
</html>
